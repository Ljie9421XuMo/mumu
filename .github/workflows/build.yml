name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # runner 每次都是干净的，AGP 现场随机生成的 debug 签名每次都不同，
      # 导致装新包必须先卸载旧包。这里把固定的调试签名解码到项目内，
      # 由 build.gradle.kts 里的 signingConfigs 显式引用（不再依赖 ~/.android 的默认路径）。
      - name: Prepare fixed debug keystore
        run: |
          base64 -d ci/debug.keystore.b64 > ci/debug.keystore
          keytool -list -v -keystore ci/debug.keystore -storepass android | grep -E 'Alias name|SHA256:'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run unit tests
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mumu-test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mumu-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
