name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # runner 每次都是干净的，~/.android/debug.keystore 不存在时 AGP 会现场随机生成一个，
      # 结果就是每次构建签名都不一样，装新包必须先卸载旧包。
      # 这里把一个固定的调试签名放回去，之后升级就能直接覆盖安装，本地数据也不会丢。
      - name: Install fixed debug keystore
        run: |
          mkdir -p ~/.android
          base64 -d ci/debug.keystore.b64 > ~/.android/debug.keystore
          ls -l ~/.android/debug.keystore

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run unit tests
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mumu-test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mumu-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
