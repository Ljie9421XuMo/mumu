<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>MuMu</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    #stage {
      width: 132px;
      height: 132px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    #pet {
      transform-origin: 50% 88%;
      animation: breathe 3.2s ease-in-out infinite;
      transition: transform 0.15s ease-out;
    }

    @keyframes breathe {
      0%, 100% { transform: scale(1, 1); }
      50%      { transform: scale(1.04, 0.97); }
    }

    #pet.hop { animation: hop 0.45s ease-out; }

    @keyframes hop {
      0%   { transform: translateY(0) scale(1, 1); }
      35%  { transform: translateY(-26px) scale(0.94, 1.08); }
      70%  { transform: translateY(0) scale(1.08, 0.92); }
      100% { transform: translateY(0) scale(1, 1); }
    }

    canvas {
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
  </style>
</head>
<body>
  <div id="stage">
    <div id="pet"><canvas id="c"></canvas></div>
  </div>

  <script>
    (function () {
      // 小狐狸像素图。A=狐狸色 E=眼睛 W=白色吻部 .=透明
      var ART = [
        '..A......A..',
        '.AAA....AAA.',
        '.AAAA..AAAA.',
        '.AAAAAAAAAA.',
        'AAAAAAAAAAAA',
        'AAAEAAAAEAAA',
        'AAAAAAAAAAAA',
        'AAAAWWWWAAAA',
        '.AAAAAAAAAA.',
        '.AAAAAAAAAA.',
        '..AAAAAAAA..',
        '...AAAAAA...'
      ];

      var COLORS = {
        A: '#e4632d',
        E: '#2b1b46',
        W: '#fff4e2'
      };

      var SIZE = 12;
      var SCALE = 10;

      var canvas = document.getElementById('c');
      var ctx = canvas.getContext('2d');
      var dpr = window.devicePixelRatio || 1;

      canvas.style.width = (SIZE * SCALE) + 'px';
      canvas.style.height = (SIZE * SCALE) + 'px';
      canvas.width = SIZE * SCALE * dpr;
      canvas.height = SIZE * SCALE * dpr;
      ctx.scale(dpr, dpr);

      function draw(blink) {
        ctx.clearRect(0, 0, SIZE * SCALE, SIZE * SCALE);
        for (var y = 0; y < SIZE; y++) {
          var row = ART[y];
          for (var x = 0; x < SIZE; x++) {
            var ch = row.charAt(x);
            if (ch === '.') continue;
            var color = COLORS[ch];
            if (!color) continue;
            if (blink && ch === 'E') color = COLORS.A;
            ctx.fillStyle = color;
            ctx.fillRect(x * SCALE, y * SCALE, SCALE, SCALE);
          }
        }
      }

      draw(false);

      // 眨眼
      setInterval(function () {
        draw(true);
        setTimeout(function () { draw(false); }, 140);
      }, 4200);

      var pet = document.getElementById('pet');

      pet.addEventListener('click', function () {
        pet.classList.remove('hop');
        void pet.offsetWidth;
        pet.classList.add('hop');
      });

      pet.addEventListener('animationend', function () {
        pet.classList.remove('hop');
      });

      // 情绪引擎接口，阶段 3 从这里接进来
      window.MuMu = {
        draw: draw,
        setMood: function (mood) {
          document.body.setAttribute('data-mood', mood);
          if (mood === 'happy') draw(false);
        }
      };
    })();
  </script>
</body>
</html>
