<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>MuMu</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    #stage {
      width: 132px;
      height: 132px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    #pet {
      transform-origin: 50% 88%;
      animation: breathe 3.2s ease-in-out infinite;
      transition: transform 0.15s ease-out, filter 0.4s ease-out;
    }

    @keyframes breathe {
      0%, 100% { transform: scale(1, 1); }
      50%      { transform: scale(1.04, 0.97); }
    }

    #pet.hop { animation: hop 0.45s ease-out; }

    @keyframes hop {
      0%   { transform: translateY(0) scale(1, 1); }
      35%  { transform: translateY(-26px) scale(0.94, 1.08); }
      70%  { transform: translateY(0) scale(1.08, 0.92); }
      100% { transform: translateY(0) scale(1, 1); }
    }

    /* 心情影响外观：开心更亮，难过发灰 */
    body[data-mood="happy"] #pet { filter: brightness(1.08) saturate(1.1); }
    body[data-mood="sad"]   #pet { filter: saturate(0.62) brightness(0.92); }

    canvas {
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
  </style>
</head>
<body>
  <div id="stage">
    <div id="pet"><canvas id="c"></canvas></div>
  </div>

  <script>
    (function () {
      // 小狐狸像素图。A=狐狸色 E=眼睛 W=白色吻部 .=透明
      var ART = [
        '..A......A..',
        '.AAA....AAA.',
        '.AAAA..AAAA.',
        '.AAAAAAAAAA.',
        'AAAAAAAAAAAA',
        'AAAEAAAAEAAA',
        'AAAAAAAAAAAA',
        'AAAAWWWWAAAA',
        '.AAAAAAAAAA.',
        '.AAAAAAAAAA.',
        '..AAAAAAAA..',
        '...AAAAAA...'
      ];

      var COLORS = {
        A: '#e4632d',
        E: '#2b1b46',
        W: '#fff4e2'
      };

      var SIZE = 12;
      var SCALE = 10;

      var canvas = document.getElementById('c');
      var ctx = canvas.getContext('2d');
      var dpr = window.devicePixelRatio || 1;

      canvas.style.width = (SIZE * SCALE) + 'px';
      canvas.style.height = (SIZE * SCALE) + 'px';
      canvas.width = SIZE * SCALE * dpr;
      canvas.height = SIZE * SCALE * dpr;
      ctx.scale(dpr, dpr);

      var mood = 'idle';
      var blinkMs = 4200;
      var blinkTimer = null;

      function draw(blink) {
        ctx.clearRect(0, 0, SIZE * SCALE, SIZE * SCALE);
        for (var y = 0; y < SIZE; y++) {
          var row = ART[y];
          for (var x = 0; x < SIZE; x++) {
            var ch = row.charAt(x);
            if (ch === '.') continue;
            var color = COLORS[ch];
            if (!color) continue;
            if (blink && ch === 'E') color = COLORS.A;
            ctx.fillStyle = color;
            ctx.fillRect(x * SCALE, y * SCALE, SCALE, SCALE);
          }
        }
      }

      draw(false);

      // 眨眼：心情越好眨得越勤
      function scheduleBlink() {
        if (blinkTimer) clearInterval(blinkTimer);
        blinkTimer = setInterval(function () {
          draw(true);
          setTimeout(function () { draw(false); }, 140);
        }, blinkMs);
      }
      scheduleBlink();

      var pet = document.getElementById('pet');

      function hop() {
        pet.classList.remove('hop');
        void pet.offsetWidth;
        pet.classList.add('hop');
      }

      pet.addEventListener('click', function () {
        hop();
        try {
          if (window.MuMuNative && window.MuMuNative.onPetTap) {
            window.MuMuNative.onPetTap();
          }
        } catch (e) {}
      });

      pet.addEventListener('animationend', function () {
        pet.classList.remove('hop');
      });

      // 原生侧（PetOverlayService）通过这里把云端状态推下来
      window.MuMu = {
        draw: draw,
        hop: hop,
        setMood: function (m) {
          mood = m || 'idle';
          document.body.setAttribute('data-mood', mood);
          draw(false);
        },
        applyState: function (s) {
          if (!s) return;
          mood = s.mood || 'idle';
          document.body.setAttribute('data-mood', mood);
          document.body.setAttribute('data-energy', s.energy);
          document.body.setAttribute('data-intimacy', s.intimacy);
          document.body.setAttribute('data-synced', s.synced ? '1' : '0');

          var next = 4200;
          if (mood === 'happy') next = 2600;
          if (mood === 'sad') next = 7000;
          if (next !== blinkMs) {
            blinkMs = next;
            scheduleBlink();
          }
          draw(false);
        }
      };
    })();
  </script>
</body>
</html>
