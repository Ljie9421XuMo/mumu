<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>MuMu</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    #stage {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    #pet {
      transform-origin: 50% 88%;
      animation: breathe 3.2s ease-in-out infinite;
      transition: transform 0.15s ease-out, filter 0.4s ease-out;
    }

    @keyframes breathe {
      0%, 100% { transform: scale(1, 1); }
      50%      { transform: scale(1.04, 0.97); }
    }

    #pet.hop { animation: hop 0.45s ease-out; }

    @keyframes hop {
      0%   { transform: translateY(0) scale(1, 1); }
      35%  { transform: translateY(-26px) scale(0.94, 1.08); }
      70%  { transform: translateY(0) scale(1.08, 0.92); }
      100% { transform: translateY(0) scale(1, 1); }
    }

    /* \u5fc3\u60c5/\u7cbe\u529b\u5f71\u54cd\u5916\u89c2\uff1a\u5f00\u5fc3\u66f4\u4eae\uff0c\u96be\u8fc7\u53d1\u7070\uff0c\u7d2f\u4e86\u4e00\u70b9\uff0c\u56f0\u4e86\u6700\u6c89 */
    body[data-mood="happy"]  #pet { filter: brightness(1.08) saturate(1.1); }
    body[data-mood="sad"]    #pet { filter: saturate(0.62) brightness(0.92); }
    body[data-mood="tired"]  #pet { filter: saturate(0.82) brightness(0.94); }
    body[data-mood="sleepy"] #pet { filter: saturate(0.7) brightness(0.84) blur(0.3px); }

    canvas {
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
  </style>
</head>
<body>
  <div id="stage">
    <div id="pet"><canvas id="c"></canvas></div>
  </div>

  <script>
    (function () {
      // \u5c0f\u72d0\u72f8\u50cf\u7d20\u56fe\u3002A=\u72d0\u72f8\u8272 E=\u773c\u775b W=\u767d\u8272\u543b\u90e8 .=\u900f\u660e
      var ART = [
        '..A......A..',
        '.AAA....AAA.',
        '.AAAA..AAAA.',
        '.AAAAAAAAAA.',
        'AAAAAAAAAAAA',
        'AAAEAAAAEAAA',
        'AAAAAAAAAAAA',
        'AAAAWWWWAAAA',
        '.AAAAAAAAAA.',
        '.AAAAAAAAAA.',
        '..AAAAAAAA..',
        '...AAAAAA...'
      ];

      var COLORS = {
        A: '#e4632d',
        E: '#2b1b46',
        W: '#fff4e2'
      };

      var SIZE = 12;
      var SCALE = 10;

      var canvas = document.getElementById('c');
      var ctx = canvas.getContext('2d');
      var dpr = window.devicePixelRatio || 1;

      canvas.style.width = (SIZE * SCALE) + 'px';
      canvas.style.height = (SIZE * SCALE) + 'px';
      canvas.width = SIZE * SCALE * dpr;
      canvas.height = SIZE * SCALE * dpr;
      ctx.scale(dpr, dpr);

      var mood = 'idle';
      var blinkMs = 4200;
      var blinkTimer = null;

      function draw(blink) {
        ctx.clearRect(0, 0, SIZE * SCALE, SIZE * SCALE);
        for (var y = 0; y < SIZE; y++) {
          var row = ART[y];
          for (var x = 0; x < SIZE; x++) {
            var ch = row.charAt(x);
            if (ch === '.') continue;
            var color = COLORS[ch];
            if (!color) continue;
            if (blink && ch === 'E') color = COLORS.A;
            ctx.fillStyle = color;
            ctx.fillRect(x * SCALE, y * SCALE, SCALE, SCALE);
          }
        }
      }

      draw(false);

      // \u7728\u773c\uff1a\u5fc3\u60c5\u8d8a\u597d\u7728\u5f97\u8d8a\u52e4\uff0c\u7d2f\u4e86/\u56f0\u4e86\u5c31\u6162\u4e0b\u6765
      function scheduleBlink() {
        if (blinkTimer) clearInterval(blinkTimer);
        blinkTimer = setInterval(function () {
          draw(true);
          setTimeout(function () { draw(false); }, 140);
        }, blinkMs);
      }
      scheduleBlink();

      var pet = document.getElementById('pet');

      function hop() {
        pet.classList.remove('hop');
        void pet.offsetWidth;
        pet.classList.add('hop');
      }

      pet.addEventListener('click', function () {
        hop();
        try {
          if (window.MuMuNative && window.MuMuNative.onPetTap) {
            window.MuMuNative.onPetTap();
          }
        } catch (e) {}
      });

      pet.addEventListener('animationend', function () {
        pet.classList.remove('hop');
      });

      // \u6bcf\u79cd\u5fc3\u60c5\u7684\u7728\u773c\u95f4\u9694\u548c\u547c\u5438\u5feb\u6162
      function blinkFor(m) {
        if (m === 'happy') return 2600;
        if (m === 'tired') return 5200;
        if (m === 'sleepy') return 9000;
        if (m === 'sad') return 7000;
        return 4200;
      }

      function breatheFor(m) {
        if (m === 'tired') return '4.6s';
        if (m === 'sleepy') return '6.8s';
        return '3.2s';
      }

      function applyMood(m) {
        mood = m || 'idle';
        document.body.setAttribute('data-mood', mood);
        pet.style.animationDuration = breatheFor(mood);

        var next = blinkFor(mood);
        if (next !== blinkMs) {
          blinkMs = next;
          scheduleBlink();
        }
        draw(false);
      }

      // \u539f\u751f\u4fa7\uff08PetOverlayService\uff09\u901a\u8fc7\u8fd9\u91cc\u628a\u4e91\u7aef\u72b6\u6001\u63a8\u4e0b\u6765
      window.MuMu = {
        draw: draw,
        hop: hop,
        setMood: applyMood,
        applyState: function (s) {
          if (!s) return;
          applyMood(s.mood);
          document.body.setAttribute('data-energy', s.energy);
          document.body.setAttribute('data-intimacy', s.intimacy);
          document.body.setAttribute('data-synced', s.synced ? '1' : '0');
        }
      };
    })();
  </script>
</body>
</html>
